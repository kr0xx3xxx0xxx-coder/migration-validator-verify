<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:20px;background:#fff;font-family:sans-serif}/* ── 통계검증 결과 ── */
/* MISMATCH-COLOR(§21·§25): 기본 행 흰색 + 교차 줄무늬 #F8FAFC — 행 전체 경고색 금지.
   존재 불일치 행의 연한 주황(#FFF7ED)은 인라인이 줄무늬보다 우선한다. 헤더는 기존 연한 파란 계열 유지. */
#exec-result-tbody tr:nth-child(even){background:#F8FAFC}
.exec-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.exec-stat{padding:14px 16px;border-radius:var(--r);text-align:center;border:1px solid var(--border)}
.exec-stat-label{font-size:.74rem;color:var(--sub);margin-bottom:4px;
  font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.exec-stat-value{font-size:1.35rem;font-weight:700}
.exec-stat.es-total{background:#f0f2f5;color:var(--text)}
.exec-stat.es-matched{background:var(--st-success-bg);color:var(--st-success-fg)}
.exec-stat.es-diff{background:var(--st-danger-bg);color:var(--st-danger-fg)}
.exec-stat.es-ok{background:var(--st-success-bg);color:var(--st-success-fg)}
.exec-stat.es-rate{background:#eef2ff;color:var(--primary)}
.exec-verdict{display:inline-block;padding:2px 10px;border-radius:12px;
  font-size:.76rem;font-weight:700;white-space:nowrap}
.exec-verdict.ev-ok{background:var(--st-success-bg);color:var(--st-success-fg)}
.exec-verdict.ev-diff{background:var(--st-danger-bg);color:var(--st-danger-fg)}
.exec-verdict.ev-warn{background:#fef5e7;color:var(--low)}
.exec-verdict.ev-src-only{background:#fff0c0;color:#b77800}
.exec-verdict.ev-tgt-only{background:#ede0ff;color:#7c3aed}
.exec-toggle-btn{padding:5px 12px;border:1px solid var(--border);border-radius:var(--r);
  background:#f8f9fa;color:var(--text);font-size:.81rem;cursor:pointer;line-height:1.4}
.exec-toggle-btn:hover{background:#e9ecef}
/* ── 2줄 헤더: 한글명(mv-th-ko) + 영문명(mv-th-en) ── */
.mv-th-ko{font-weight:600;line-height:1.2}
.mv-th-en{font-size:.72rem;color:#6c7a89;line-height:1.1;margin-top:2px}
/* ── STAGE5-MISMATCH-GRID-HEADER-CLEANUP: 원본/목적 텍스트 라벨(색상 의존 제거) ──
   열 배경색(파랑=원본 / 청록=목적)만으로 구분하던 것을 헤더에 텍스트로도 병기한다. */
.mv-th-side{font-size:.7rem;font-weight:700;line-height:1.1;margin-top:2px}
.mv-th-side.mts-tgt{color:#0f766e}   /* 목적 — 청록 계열 */
.mv-th-side.mts-src{color:#1d4ed8}   /* 원본 — 파랑 계열 */
/* ── 컬럼별 차이 요약 가로 카드 ── */
.exec-col-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.exec-col-chip{padding:10px 14px;border-radius:var(--r);min-width:130px;
  border:1px solid var(--border);flex:0 0 auto}
.exec-col-chip.ecc-ok{background:var(--st-success-bg);border-color:var(--st-success-bd)}
.exec-col-chip.ecc-diff{background:var(--st-danger-bg);border-color:var(--st-danger-bd)}
.ecc-label{font-size:.77rem;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3}
.ecc-cnt{font-size:.85rem;font-weight:700;margin-bottom:2px}
.exec-col-chip.ecc-ok .ecc-cnt{color:var(--st-success-fg)}
.exec-col-chip.ecc-diff .ecc-cnt{color:var(--st-danger-fg)}
.ecc-status{font-size:.72rem}
.exec-col-chip.ecc-ok .ecc-status{color:var(--st-success-fg)}
.exec-col-chip.ecc-diff .ecc-status{color:var(--st-danger-fg)}
.ecc-conv{font-size:.7rem;color:#b77800;margin-top:3px}
@media(max-width:600px){.exec-summary{grid-template-columns:repeat(2,1fr)}}</style>
</head><body><div id="executeOut">
<div style="overflow-x:auto">

  </table>
</div>
</div></body></html>
